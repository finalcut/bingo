name: Deploy Bingo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bingo-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to DigitalOcean
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DO_HOST }}
          DEPLOY_USER: ${{ secrets.DO_USER }}
          DEPLOY_PATH: ${{ vars.DO_APP_DIR }}
          DEPLOY_SERVICE: ${{ vars.DO_SYSTEMD_SERVICE }}
          DEPLOY_PORT: ${{ vars.DO_APP_PORT || '3001' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing DO_HOST secret}"
          : "${DEPLOY_USER:?Missing DO_USER secret}"
          : "${DEPLOY_PATH:?Missing DO_APP_DIR variable}"
          : "${DEPLOY_SERVICE:?Missing DO_SYSTEMD_SERVICE variable}"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$DEPLOY_PATH' '$DEPLOY_SERVICE' '$DEPLOY_PORT'" \
            < scripts/deploy-on-droplet.sh